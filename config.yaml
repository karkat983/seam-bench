# All tunable values live here so a reader can swap them without touching code.

llm:
  # Default: a local open-weights model through Ollama (free, no key, reproducible).
  # Set provider: anthropic to run the same benchmark on Claude (needs ANTHROPIC_API_KEY).
  provider: ollama
  model: qwen2.5:7b-instruct      # used for every agent step and the summarizer
  max_tokens: 512
  temperature: 0                  # greedy decoding
  seed: 7                         # fixed seed; still NOT bit-exact on GPU (see docs/notes.md)
  ollama_host: http://localhost:11434
  anthropic_model: claude-opus-5-5
  anthropic_effort: medium        # Opus 5.5 has no temperature; effort is the quality/cost knob

embeddings:
  # Chroma's built-in local model (all-MiniLM-L6-v2, ONNX). No API key, no cost.
  model: chroma-default

retrieval:
  k: 5

chunking:
  # all-MiniLM-L6-v2 reads at most 256 word pieces (~1,000 characters); longer text is
  # silently truncated, so long techniques are split into overlapping parts.
  max_chars: 1000
  overlap_chars: 150

paths:
  stix_bundle: data/raw/enterprise-attack.json
  chroma_dir: data/chroma
  llm_cache: data/cache
  tasks: data/tasks.json
  cves: data/cves.json

attack:
  # Pinned to a tagged release so every run indexes the same data.
  stix_url: https://raw.githubusercontent.com/mitre/cti/ATT%26CK-v19.2/enterprise-attack/enterprise-attack.json
  stix_sha256: f7eaf37fe53b50404084fe1fe67237278f7317e61c11ad550295722d13ede259
  collection: attack_techniques
